name: Release and Publish VS Code Extension

concurrency:
  group: release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      type:
        type: choice
        description: Type
        options:
          - release
          - pre-release
        default: release
      date:
        type: string
        description: 'Date ("YYYY-MM-DD" or "today")'
        default: today
      version:
        type: string
        description: "Version"
        default: "minor"

# The job that creates this branch and the job that deletes it must name the
# same ref, so the name is written once here.
env:
  BRANCH: ci/bump-version

jobs:
  bump:
    runs-on: ubuntu-latest

    # `GITHUB_TOKEN` writes nothing here. Every push carries the app token.
    permissions:
      contents: read

    env:
      COMMIT: "ci: bump version for release :rocket:"
      BUMP_VERSION: ${{ inputs.version }}

    outputs:
      # A skipped step reports an empty output, so a release with nothing to
      # bump falls through to the commit the dispatch resolved. That is how a
      # release whose publish failed is dispatched a second time.
      sha: ${{ steps.bump.outputs.sha || github.sha }}
      bumped: ${{ steps.check_unreleased.outputs.UNRELEASED_FOUND }}

    steps:
      # The bump lands on `main` by a fast-forward push in the package job. A
      # dispatch from any other branch would push a commit of that branch onto
      # `main`, or be refused as not a fast-forward, and neither is a release.
      - name: Check the release runs from main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::The release runs from main only. It was dispatched from ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      # The checkout keeps this token, so the push below runs as the app. The
      # app is exempt from the ruleset, which is what lets the bump land on
      # `main` without a pull request.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Get GitHub App User ID
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "${GITHUB_OUTPUT}"

      - name: Configure Environment for Git User
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          USER_ID: ${{ steps.get-user-id.outputs.user-id }}
        run: |
          if [ -z "${APP_SLUG}" ]; then
            USER_NAME="github-actions[bot]"
            USER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          else
            USER_NAME="${APP_SLUG}[bot]"
            USER_EMAIL="${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          fi
          git config --global user.name "${USER_NAME}"
          git config --global user.email "${USER_EMAIL}"

      - name: Check for "unreleased" in CHANGELOG.md
        id: check_unreleased
        shell: bash
        run: |
          if grep -q "Unreleased" CHANGELOG.md; then
            echo "UNRELEASED_FOUND=true" >> "${GITHUB_OUTPUT}"
          else
            echo "UNRELEASED_FOUND=false" >> "${GITHUB_OUTPUT}"
          fi

      # Quarto renders the documentation, and Node runs the bump itself. A
      # release with nothing to bump does neither, so both sit behind the
      # check above rather than in front of it.
      - name: Set up Quarto CLI
        if: ${{ steps.check_unreleased.outputs.UNRELEASED_FOUND == 'true' }}
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release

      - name: Set up Node.js
        if: ${{ steps.check_unreleased.outputs.UNRELEASED_FOUND == 'true' }}
        uses: actions/setup-node@v7

      - name: Install dependencies
        if: ${{ steps.check_unreleased.outputs.UNRELEASED_FOUND == 'true' }}
        shell: bash
        run: npm install

      - name: Bump the version and push it to the temporary branch
        id: bump
        if: ${{ steps.check_unreleased.outputs.UNRELEASED_FOUND == 'true' }}
        env:
          DATE: ${{ github.event.inputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${DATE}" = "today" ]; then
            DATE=$(date +%Y-%m-%d)
          fi

          npm version "${BUMP_VERSION}" --no-git-tag-version
          npm run sync-metadata

          VERSION=$(jq -r .version package.json)
          sed -i "s/Unreleased/${VERSION} (${DATE})/" CHANGELOG.md
          sed -i "s/^version:.*/version: ${VERSION}/" CITATION.cff
          sed -i "s/^date-released:.*/date-released: \"${DATE}\"/" CITATION.cff

          npm run docs:build

          git add CHANGELOG.md CITATION.cff package.json package-lock.json packages/*/package.json docs/
          git commit -m "${COMMIT}"

          # No pull request. The commit goes to a branch of its own, the
          # verify job builds it there, and the package job fast-forwards
          # `main` to it once the matrix has passed. `--force`, because a run
          # that ended before the cleanup job, or a lost runner, can leave the
          # branch behind, and this run must not stop on that.
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  # The full matrix and the Lua job, on the exact tree the release publishes.
  # This is the gate that the bump pull request used to be. A called workflow
  # runs inside this run, so `verdict.yml` never fires for it.
  #
  # A release with nothing to bump publishes a commit that is already on
  # `main`, which reached `main` through a pull request and carries a green
  # `verdict` for that reason. Building it again costs a three operating
  # system matrix and answers a question that is already answered.
  verify:
    needs: bump
    if: needs.bump.outputs.bumped == 'true'
    permissions: read-all
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}

  package:
    runs-on: ubuntu-latest

    needs: [bump, verify]

    # A skipped `verify` is the release that had nothing to bump, and it must
    # reach the publish jobs, because that is how a release recovers from a
    # publish that failed. A `verify` that ran and did not pass must not.
    # `always()` is what lets this job read a skipped result at all.
    if: >-
      always()
      && needs.bump.result == 'success'
      && needs.verify.result != 'failure'
      && needs.verify.result != 'cancelled'

    # `GITHUB_TOKEN` writes nothing here. The push to `main` carries the app
    # token, and the attestation needs the two write scopes below.
    permissions:
      contents: read
      id-token: write
      attestations: write

    outputs:
      version: ${{ steps.set-version.outputs.version }}
      # Carried on so the release tag lands on the commit these artefacts were
      # built from.
      sha: ${{ steps.set-version.outputs.sha }}

    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      # The commit the matrix built, not the tip of the default branch. Any
      # commit landing on `main` between the dispatch and this checkout would
      # otherwise be the one that gets packaged and published.
      - name: Checkout the commit the matrix built
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Set version
        id: set-version
        shell: bash
        run: |
          current_version=$(jq -r .version package.json)
          version_line=$(grep -n '"version"' package.json | cut -d: -f1)
          echo "VERSION=${current_version}" >> "${GITHUB_ENV}"
          echo "version=${current_version}" >> "${GITHUB_OUTPUT}"
          echo "::notice file=package.json,line=${version_line}::${current_version}"

          # Read from the tree that is checked out, and not by repeating the
          # expression that chose it. The tag is meant to name the commit these
          # assets were built from, so take it from the build.
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set changelog
        env:
          VERSION: ${{ env.VERSION }}
        shell: bash
        run: |
          awk -v version="^## ${VERSION}.*" '
            $0 ~ version {flag=1; next}
            /^## / && flag {flag=0}
            flag
          ' CHANGELOG.md >"CHANGELOG-${VERSION}.md"
          echo "CHANGELOG=CHANGELOG-${VERSION}.md" >> "${GITHUB_ENV}"

      - name: Append installation instructions to changelog
        env:
          WIZARD_VERSION: ${{ env.VERSION }}
          CHANGELOG: ${{ env.CHANGELOG }}
          REPO: ${{ github.repository }}
          DOCS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        shell: bash
        run: |
          # The single quotes are the point. `envsubst` reads the list of
          # names to expand, and the shell must not expand them first.
          # shellcheck disable=SC2016
          envsubst '${WIZARD_VERSION} ${REPO} ${DOCS_URL}' \
            < .github/workflows/assets/install-instructions.md \
            >> "${CHANGELOG}"

      - name: Package extension
        env:
          TYPE: ${{ github.event.inputs.type }}
        shell: bash
        run: |
          if [ "${TYPE}" = "pre-release" ]; then
            npx @vscode/vsce package --pre-release
          else
            npx @vscode/vsce package
          fi

      - name: Package core library
        shell: bash
        run: |
          cd packages/core
          npm pack
          mv quarto-wizard-core-*.tgz "${GITHUB_WORKSPACE}/"

      - name: Package schema library
        shell: bash
        run: |
          cd packages/schema
          npm pack
          mv quarto-wizard-schema-*.tgz "${GITHUB_WORKSPACE}/"

      - name: Copy schema validator asset
        shell: bash
        run: cp packages/schema/src/validation/schema.lua "${GITHUB_WORKSPACE}/schema.lua"

      - name: Package snippets library
        shell: bash
        run: |
          cd packages/snippets
          npm pack
          mv quarto-wizard-snippets-*.tgz "${GITHUB_WORKSPACE}/"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ github.workspace }}/quarto-wizard-${{ env.VERSION }}.vsix
            ${{ github.workspace }}/quarto-wizard-core-${{ env.VERSION }}.tgz
            ${{ github.workspace }}/quarto-wizard-schema-${{ env.VERSION }}.tgz
            ${{ github.workspace }}/quarto-wizard-snippets-${{ env.VERSION }}.tgz
            ${{ github.workspace }}/schema.lua

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            quarto-wizard-${{ env.VERSION }}.vsix
            quarto-wizard-core-${{ env.VERSION }}.tgz
            quarto-wizard-schema-${{ env.VERSION }}.tgz
            quarto-wizard-snippets-${{ env.VERSION }}.tgz
            schema.lua
            CHANGELOG-${{ env.VERSION }}.md
          if-no-files-found: error
          retention-days: 30

      # Last, and not first. `main` carrying a released version number with no
      # release is the state this job can leave behind, so the window where it
      # holds is the few seconds after this step rather than the length of the
      # build above.
      #
      # A fast-forward, so the commit on `main` is the commit the matrix built
      # and the `non_fast_forward` rule is never in question. The app is exempt
      # from the ruleset, which is what lets this push skip the pull request
      # and the required check. A push that is refused means `main` moved since
      # the dispatch, and the bump then belongs on the new tip.
      - name: Land the bump on main
        if: ${{ needs.bump.outputs.bumped == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git push origin HEAD:refs/heads/main; then
            echo "::error::main moved since this release was dispatched, so the bump cannot land on it. Dispatch the release again."
            exit 1
          fi

  # The branch must not outlive the run, so this job runs after success, after
  # failure and after a cancel. It needs no ordering against the jobs that
  # publish: they read the release bundle and the tag, and neither reads this
  # branch. The commit is on `main` by now, or the release is over and the next
  # bump starts from scratch.
  cleanup:
    runs-on: ubuntu-latest

    # `package` already waits for `bump` and `verify`, so this one edge gives
    # the same ordering.
    needs: package

    if: always()

    permissions: {}

    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      # A branch that is already absent is the wanted state and not an error.
      # A release with nothing to bump never creates it, and a run that failed
      # in `bump` may have ended before the push.
      - name: Delete the temporary branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          DELETE_ERROR=$(mktemp)
          if gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${BRANCH}" 2>"${DELETE_ERROR}"; then
            echo "Deleted ${BRANCH}."
          elif grep -qiF 'reference does not exist' "${DELETE_ERROR}"; then
            echo "${BRANCH} was already absent."
          else
            echo "::error::Could not delete ${BRANCH}: $(tr '\n' ' ' < "${DELETE_ERROR}")"
            exit 1
          fi

  release-github:
    runs-on: ubuntu-latest

    needs: package

    permissions:
      contents: write

    env:
      VERSION: ${{ needs.package.outputs.version }}
      SHA: ${{ needs.package.outputs.sha }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle

      - name: Create or verify the GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TYPE: ${{ github.event.inputs.type }}
          CHANGELOG: CHANGELOG-${{ env.VERSION }}.md
        shell: bash
        run: |
          ASSETS=(
            "./quarto-wizard-${VERSION}.vsix#Quarto Wizard (vsix)"
            "./quarto-wizard-core-${VERSION}.tgz#Quarto Wizard Core (tgz)"
            "./quarto-wizard-schema-${VERSION}.tgz#Quarto Wizard Schema (tgz)"
            "./quarto-wizard-snippets-${VERSION}.tgz#Quarto Wizard Snippets (tgz)"
            "./schema.lua#Quarto Wizard Schema Validator (lua)"
          )

          # One call, which both reports whether the release is there and
          # lists what it carries. It reads the state of each asset and not
          # the name alone, because an upload that died part way leaves the
          # name on the release with a state that is not `uploaded`, and that
          # is the very failure a second dispatch is here to recover from.
          #
          # `release not found` is the one failure that means the release is
          # absent. Every other failure is a failure to read, and a guard that
          # takes what it cannot read as an absence stops being a guard. This
          # one would create a release that is already there.
          VIEW_ERROR=$(mktemp)
          if PRESENT=$(gh release view "${VERSION}" --json assets \
            --jq '.assets[] | select(.state == "uploaded") | .name' 2>"${VIEW_ERROR}"); then
            FOUND=true
          elif grep -qiF 'release not found' "${VIEW_ERROR}"; then
            FOUND=false
          else
            echo "::error::Could not read release ${VERSION}: $(tr '\n' ' ' < "${VIEW_ERROR}")"
            exit 1
          fi

          if [ "${FOUND}" = true ]; then
            # The tag of an existing release stays where it is. Assets built
            # somewhere else would leave the tag and the assets naming
            # different commits, which is what this release is careful not
            # to do.
            TAGGED=$(gh api "repos/${GH_REPO}/git/ref/tags/${VERSION}" --jq '.object.sha')
            if [ "${TAGGED}" != "${SHA}" ]; then
              echo "::error::Release ${VERSION} is tagged at ${TAGGED}, and this run built ${SHA}. Delete the release and its tag, or run the release from the tagged commit."
              exit 1
            fi

            # A published release is immutable, so its assets cannot be
            # rewritten. The check above already proves that this release was
            # built from this commit, so there is nothing here to refresh,
            # only something to confirm. This branch carries a release that
            # is dispatched a second time, which is how a release recovers
            # from a publish that failed, so it has to reach the jobs that
            # publish rather than end here.
            MISSING=""
            for asset in "${ASSETS[@]}"; do
              name=$(basename "${asset%%#*}")
              grep -qxF "${name}" <<< "${PRESENT}" || MISSING="${MISSING} ${name}"
            done
            if [ -n "${MISSING}" ]; then
              echo "::error::Release ${VERSION} exists, but these assets are missing or have not finished uploading:${MISSING}. A published release is immutable, so this run cannot replace them. Release the next patch version rather than repairing this one."
              exit 1
            fi

            echo "::notice::Release ${VERSION} already exists and carries every asset."
            exit 0
          fi

          PRERELEASE_FLAG=""
          if [ "${TYPE}" = "pre-release" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # `--target`, so the tag records the commit these assets were built
          # from. Without it the tag lands on the tip of the default branch at
          # release time, which is not necessarily the same commit.
          gh release create "${VERSION}" \
            "${ASSETS[@]}" \
            ${PRERELEASE_FLAG} \
            --target "${SHA}" \
            --title "${VERSION}" \
            --notes-file "${CHANGELOG}" \
            --generate-notes

  publish-marketplace:
    runs-on: ubuntu-latest

    needs: [package, release-github]

    permissions: {}

    env:
      VERSION: ${{ needs.package.outputs.version }}

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle

      - name: Publish to Visual Studio Marketplace
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          TYPE: ${{ github.event.inputs.type }}
        shell: bash
        run: |
          # An empty version would ask the registry about the extension rather
          # than about a release of it, and the answer would read as "already
          # published" below.
          if [ -z "${VERSION}" ]; then
            echo "::error::The package job reported no version."
            exit 1
          fi

          # This job has no checkout and no `node_modules`, so `npx` downloads
          # the package, which is what `--yes` is for. Naming it in full keeps
          # the deprecated `vsce` package of the same name out of the call. The
          # major version tracks the `@vscode/vsce` devDependency, so this job
          # and the job that packaged the file run the same major. Move both
          # together.
          #
          # The lookup retries, as the Open VSX check does, so a busy or a
          # restarting registry does not end a release that had nothing wrong
          # with it. A failure that outlasts the attempts ends the step.
          for attempt in 1 2 3; do
            if SHOWN=$(npx --yes @vscode/vsce@3 show mcanouil.quarto-wizard --json); then
              break
            fi
            if [ "${attempt}" = 3 ]; then
              echo "::error::vsce show failed three times. The Marketplace could not be read."
              exit 1
            fi
            sleep $((attempt * 5))
          done

          # Only two answers are understood, and anything else ends the step.
          # A guard that treats what it cannot read as an absence stops being a
          # guard on the day the output changes shape, and says nothing.
          if [ "${SHOWN}" = "undefined" ]; then
            # `vsce` reports an extension that was never published this way,
            # on standard output and with a zero exit status.
            PUBLISHED=""
          elif jq -e 'type == "object" and (.versions | type == "array")' > /dev/null 2>&1 <<< "${SHOWN}"; then
            PUBLISHED=$(jq -r --arg v "${VERSION}" \
              'first(.versions[] | select(.version == $v) | .version) // ""' <<< "${SHOWN}")
          else
            # The whole answer goes to the log. A workflow command stops at the
            # first newline, so the annotation carries one line of it. The
            # runner reads a workflow command from any line of the log, so the
            # answer of the registry is indented before it is printed.
            echo "vsce show returned:"
            printf '%s\n' "${SHOWN}" | sed 's/^::/  ::/'
            echo "::error::vsce show returned an answer this check cannot read: $(head -c 200 <<< "${SHOWN}" | tr '\n' ' ')"
            exit 1
          fi

          if [ -n "${PUBLISHED}" ]; then
            echo "::notice::mcanouil.quarto-wizard@${VERSION} already on Marketplace, skipping."
            exit 0
          fi

          PRERELEASE_FLAG=""
          if [ "${TYPE}" = "pre-release" ]; then
            PRERELEASE_FLAG="--pre-release"
          fi
          npx --yes @vscode/vsce@3 publish ${PRERELEASE_FLAG} \
            --packagePath "quarto-wizard-${VERSION}.vsix" \
            --pat "${VS_MARKETPLACE_TOKEN}"

  publish-openvsx:
    runs-on: ubuntu-latest

    needs: [package, release-github]

    permissions: {}

    env:
      VERSION: ${{ needs.package.outputs.version }}

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle

      - name: Publish to Open VSX Registry
        env:
          OPEN_VSX_REGISTRY_TOKEN: ${{ secrets.OPEN_VSX_REGISTRY_TOKEN }}
          TYPE: ${{ github.event.inputs.type }}
        shell: bash
        run: |
          # An empty version would ask the registry about the extension rather
          # than about a release of it, and 200 would then read as "already
          # published" below.
          if [ -z "${VERSION}" ]; then
            echo "::error::The package job reported no version."
            exit 1
          fi

          # The step runs under `-e`, so a network failure ends it here. The
          # retries cover a busy or a restarting registry, which would
          # otherwise end a release that had nothing wrong with it. Only a
          # persistent answer reaches the branches below, where anything but
          # the two expected codes is a failure and not an absence.
          STATUS=$(curl -sSL --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' \
            "https://open-vsx.org/api/mcanouil/quarto-wizard/${VERSION}")
          case "${STATUS}" in
            200)
              echo "::notice::mcanouil/quarto-wizard@${VERSION} already on Open VSX, skipping."
              exit 0
              ;;
            404) ;;
            *)
              echo "::error::Open VSX answered ${STATUS} for the version check."
              exit 1
              ;;
          esac

          PRERELEASE_FLAG=""
          if [ "${TYPE}" = "pre-release" ]; then
            PRERELEASE_FLAG="--pre-release"
          fi
          npx --yes ovsx publish ${PRERELEASE_FLAG} \
            "quarto-wizard-${VERSION}.vsix" \
            --pat "${OPEN_VSX_REGISTRY_TOKEN}"
