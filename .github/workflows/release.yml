name: Release and Publish VS Code Extension

concurrency:
  group: release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      type:
        type: choice
        description: Type
        options:
          - release
          - pre-release
        default: release
      date:
        type: string
        description: 'Date ("YYYY-MM-DD" or "today")'
        default: today
      version:
        type: string
        description: "Version"
        default: "minor"

jobs:
  # The checks run before anything is written, on the commit the release was
  # dispatched from. This ordering is the gate.
  #
  # The bump then commits on that same commit, and what it adds is the version
  # in `package.json`, `package-lock.json` and `CITATION.cff`, a heading in
  # `CHANGELOG.md`, and the rendered documentation. None of it is a source
  # file, and nothing builds that commit before it reaches `main`. That is the
  # trade this design makes: the checks cover everything the release is built
  # from, and the bump on top of them is taken to be mechanical.
  verify:
    permissions: read-all
    uses: ./.github/workflows/build.yml

  bump:
    runs-on: ubuntu-latest

    needs: verify

    permissions:
      contents: read

    env:
      BUMP_VERSION: ${{ inputs.version }}

    outputs:
      # A skipped step reports an empty output, so a release with nothing to
      # bump falls through to the commit the dispatch resolved, which `verify`
      # has just built. That is how a release recovers from a publish that
      # failed.
      sha: ${{ steps.bump.outputs.sha || github.sha }}

    steps:
      # The bump is pushed to `main`. A dispatch from any other branch would
      # push a commit of that branch onto `main`, or be refused as not a
      # fast-forward, and neither is a release.
      - name: Check the release runs from main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::The release runs from main only. It was dispatched from ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      # The commit `verify` built, and not the tip of the branch. The checkout
      # keeps the token, so the push below runs as the app, which the ruleset
      # exempts. That is what lets the bump reach `main` with no pull request.
      - name: Checkout the commit the checks passed
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Get GitHub App User ID
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "${GITHUB_OUTPUT}"

      - name: Configure Environment for Git User
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          USER_ID: ${{ steps.get-user-id.outputs.user-id }}
        run: |
          if [ -z "${APP_SLUG}" ]; then
            USER_NAME="github-actions[bot]"
            USER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          else
            USER_NAME="${APP_SLUG}[bot]"
            USER_EMAIL="${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          fi
          git config --global user.name "${USER_NAME}"
          git config --global user.email "${USER_EMAIL}"

      # The heading, and not the word. Entries are written as full sentences,
      # so one of them can carry the word `Unreleased` in its prose, and a
      # release must not read that as a section to bump.
      - name: Check for the Unreleased heading in CHANGELOG.md
        id: check_unreleased
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "^## Unreleased$" CHANGELOG.md; then
            echo "UNRELEASED_FOUND=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "UNRELEASED_FOUND=false" >> "${GITHUB_OUTPUT}"
          # Absent is how a release that recovers a failed publish runs, so it
          # is not an error. It is also what a heading written in another
          # shape looks like, and that case ends green having released
          # nothing, so the log says which reading applies.
          echo "::notice::No '## Unreleased' heading, so this run republishes the current version. A bump was expected if that is not what you asked for."

      # Quarto renders the documentation and Node runs the bump. A release
      # with nothing to bump does neither, so both sit behind the check above.
      - name: Set up Quarto CLI
        if: ${{ steps.check_unreleased.outputs.UNRELEASED_FOUND == 'true' }}
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release

      - name: Set up Node.js
        if: ${{ steps.check_unreleased.outputs.UNRELEASED_FOUND == 'true' }}
        uses: actions/setup-node@v7

      # `npm ci` and not `npm install`, so this job, the matrix that gated the
      # release and the job that packages it all resolve the same dependency
      # tree. `npm version` below updates the version in the lock file, which
      # is the only change this job makes to it.
      - name: Install dependencies
        if: ${{ steps.check_unreleased.outputs.UNRELEASED_FOUND == 'true' }}
        shell: bash
        run: npm ci

      - name: Bump the version and push it to main
        id: bump
        if: ${{ steps.check_unreleased.outputs.UNRELEASED_FOUND == 'true' }}
        env:
          DATE: ${{ github.event.inputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${DATE}" = "today" ]; then
            DATE=$(date +%Y-%m-%d)
          fi
          # The input is free text, and it reaches the `sed` expressions below
          # as part of a substitution delimited by `/`. A value such as
          # `2026/09/11` would end the step with an error that names nothing
          # the operator typed, and only after the bump had written files.
          if ! [[ "${DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::The date input must be \"today\" or YYYY-MM-DD. Read: ${DATE}"
            exit 1
          fi

          npm version "${BUMP_VERSION}" --no-git-tag-version
          npm run sync-metadata

          VERSION=$(jq -r .version package.json)
          # The first heading alone, matched in full. A substitution on the
          # word rewrites the first match on every line, so an entry whose
          # prose carries it would be corrupted in the release notes.
          awk -v heading="## ${VERSION} (${DATE})" '
            !done && $0 == "## Unreleased" {print heading; done = 1; next}
            {print}
          ' CHANGELOG.md > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md
          sed -i "s/^version:.*/version: ${VERSION}/" CITATION.cff
          sed -i "s/^date-released:.*/date-released: \"${DATE}\"/" CITATION.cff

          npm run docs:build

          git add CHANGELOG.md CITATION.cff package.json package-lock.json packages/*/package.json docs/
          git commit -m "ci: bump version for release :rocket:"

          # A plain push, so it is a fast-forward. If `main` moved since the
          # dispatch, git refuses it and says so, and the bump belongs on the
          # new tip.
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  package:
    runs-on: ubuntu-latest

    needs: bump

    permissions:
      contents: read
      id-token: write
      attestations: write

    outputs:
      version: ${{ steps.set-version.outputs.version }}
      # Carried on so the release tag lands on the commit these artefacts were
      # built from.
      sha: ${{ steps.set-version.outputs.sha }}

    steps:
      # The commit the bump made, or the commit the dispatch resolved when
      # there was nothing to bump. Either way it is pinned, and a branch name
      # here would package whatever landed on `main` in the meantime.
      - name: Checkout the commit to release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Set version
        id: set-version
        shell: bash
        run: |
          current_version=$(jq -r .version package.json)
          version_line=$(grep -n '"version"' package.json | cut -d: -f1)
          echo "VERSION=${current_version}" >> "${GITHUB_ENV}"
          echo "version=${current_version}" >> "${GITHUB_OUTPUT}"
          echo "::notice file=package.json,line=${version_line}::${current_version}"

          # Read from the tree that is checked out, and not by repeating the
          # expression that chose it. The tag is meant to name the commit these
          # assets were built from, so take it from the build.
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set changelog
        env:
          VERSION: ${{ env.VERSION }}
        shell: bash
        run: |
          awk -v version="^## ${VERSION}.*" '
            $0 ~ version {flag=1; next}
            /^## / && flag {flag=0}
            flag
          ' CHANGELOG.md >"CHANGELOG-${VERSION}.md"
          echo "CHANGELOG=CHANGELOG-${VERSION}.md" >> "${GITHUB_ENV}"

      - name: Append installation instructions to changelog
        env:
          WIZARD_VERSION: ${{ env.VERSION }}
          CHANGELOG: ${{ env.CHANGELOG }}
          REPO: ${{ github.repository }}
          DOCS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        shell: bash
        run: |
          # The single quotes are the point. `envsubst` reads the list of
          # names to expand, and the shell must not expand them first.
          # shellcheck disable=SC2016
          envsubst '${WIZARD_VERSION} ${REPO} ${DOCS_URL}' \
            < .github/workflows/assets/install-instructions.md \
            >> "${CHANGELOG}"

      - name: Package extension
        env:
          TYPE: ${{ github.event.inputs.type }}
        shell: bash
        run: |
          if [ "${TYPE}" = "pre-release" ]; then
            npx @vscode/vsce package --pre-release
          else
            npx @vscode/vsce package
          fi

      - name: Package core library
        shell: bash
        run: |
          cd packages/core
          npm pack
          mv quarto-wizard-core-*.tgz "${GITHUB_WORKSPACE}/"

      - name: Package schema library
        shell: bash
        run: |
          cd packages/schema
          npm pack
          mv quarto-wizard-schema-*.tgz "${GITHUB_WORKSPACE}/"

      - name: Package snippets library
        shell: bash
        run: |
          cd packages/snippets
          npm pack
          mv quarto-wizard-snippets-*.tgz "${GITHUB_WORKSPACE}/"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ github.workspace }}/quarto-wizard-${{ env.VERSION }}.vsix
            ${{ github.workspace }}/quarto-wizard-core-${{ env.VERSION }}.tgz
            ${{ github.workspace }}/quarto-wizard-schema-${{ env.VERSION }}.tgz
            ${{ github.workspace }}/quarto-wizard-snippets-${{ env.VERSION }}.tgz

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            quarto-wizard-${{ env.VERSION }}.vsix
            quarto-wizard-core-${{ env.VERSION }}.tgz
            quarto-wizard-schema-${{ env.VERSION }}.tgz
            quarto-wizard-snippets-${{ env.VERSION }}.tgz
            CHANGELOG-${{ env.VERSION }}.md
          if-no-files-found: error
          retention-days: 30

  release-github:
    runs-on: ubuntu-latest

    needs: package

    permissions:
      contents: write

    env:
      VERSION: ${{ needs.package.outputs.version }}
      SHA: ${{ needs.package.outputs.sha }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle

      # Drafted here, and published only once both stores have taken the
      # version. This repository publishes immutable releases: a published one
      # cannot take an asset, lose one, or give its tag back, and the tag name
      # stays reserved even after the release and the tag are deleted, so a
      # version that publishes without all of its assets is spent rather than
      # broken. A draft creates no tag and is not immutable, so a run that
      # dies during the upload leaves only a draft to delete and the same
      # version can be released again. This is the order GitHub documents, for
      # the same reason.
      - name: Draft or verify the GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TYPE: ${{ github.event.inputs.type }}
          CHANGELOG: CHANGELOG-${{ env.VERSION }}.md
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=(
            "./quarto-wizard-${VERSION}.vsix#Quarto Wizard (vsix)"
            "./quarto-wizard-core-${VERSION}.tgz#Quarto Wizard Core (tgz)"
            "./quarto-wizard-schema-${VERSION}.tgz#Quarto Wizard Schema (tgz)"
            "./quarto-wizard-snippets-${VERSION}.tgz#Quarto Wizard Snippets (tgz)"
          )

          # Reads the state of each asset and not the name alone, because an
          # upload that died part way leaves the name on the release with a
          # state that is not `uploaded`, and that is the failure this job is
          # built around. It takes the names from `ASSETS`, so the list that
          # uploads the assets is the same list that every check of them reads,
          # and a fifth artefact cannot be added to one and forgotten in the
          # other. Reads the release JSON on standard input, and writes the
          # names it did not find.
          missing_assets() {
            local present name missing=""
            present=$(jq -r '.assets[] | select(.state == "uploaded") | .name')
            for name in "${ASSETS[@]}"; do
              name=$(basename "${name%%#*}")
              grep -qxF "${name}" <<< "${present}" || missing="${missing} ${name}"
            done
            printf '%s' "${missing}"
          }

          # One call, which reports whether the release is there, whether it is
          # still a draft, and what it carries.
          #
          # `release not found` is the one failure that means the release is
          # absent. Every other failure is a failure to read, and a guard that
          # takes what it cannot read as an absence stops being a guard. This
          # one would create a release that is already there.
          VIEW_ERROR=$(mktemp)
          if VIEW=$(gh release view "${VERSION}" --json isDraft,assets 2>"${VIEW_ERROR}"); then
            FOUND=true
          elif grep -qiF 'release not found' "${VIEW_ERROR}"; then
            FOUND=false
          else
            echo "::error::Could not read release ${VERSION}: $(tr '\n' ' ' < "${VIEW_ERROR}")"
            exit 1
          fi

          if [ "${FOUND}" = true ]; then
            # A draft is the one shape that can be cleared. It holds no tag yet
            # and it is not immutable, so nothing on the GitHub side is spent.
            #
            # The run that left the draft is the cheapest way out, and the
            # message names it first. Its `release-bundle` artifact holds for
            # thirty days, so re-running its failed jobs reaches the same
            # draft, at the same commit, with the same assets, and rebuilds
            # nothing.
            #
            # A dispatch is the expensive way out, and the message asks the
            # operator to read the stores before taking it. A draft is left by
            # a run that failed anywhere between the draft and the publish, and
            # the store publishes sit in that window. A dispatch that follows a
            # deletion finds no `## Unreleased` heading, so it builds the
            # current tip of `main` and releases the same version from it.
            # Where a store already carries that version, its job skips, and
            # the tag and the attestation would come to name a commit that the
            # binaries the store serves were not built from. Nothing downstream
            # detects that, so it is refused here.
            if [ "$(jq -r '.isDraft' <<< "${VIEW}")" = true ]; then
              echo "::error::A draft release ${VERSION} is left from an earlier run. Nothing is published on GitHub, so the version is not spent there. Re-run the failed jobs of the run that left it: that reaches this same draft at the same commit and rebuilds nothing. Dispatch again only when that run is too old for its artefacts, or main has moved, and read the Marketplace and Open VSX first. If either already carries ${VERSION}, release the next patch version, because a dispatch that follows a deletion builds the tip of main and would tag a commit that the published binaries were not built from. If neither carries it, delete the draft with \`gh release delete ${VERSION}\` and dispatch again."
              exit 1
            fi

            # The tag of an existing release stays where it is. Assets built
            # somewhere else would leave the tag and the assets naming
            # different commits, which is what this release is careful not
            # to do.
            TAGGED=$(gh api "repos/${GH_REPO}/git/ref/tags/${VERSION}" --jq '.object.sha')
            if [ "${TAGGED}" != "${SHA}" ]; then
              echo "::error::Release ${VERSION} is tagged at ${TAGGED}, and this run built ${SHA}. Delete the release and its tag, or run the release from the tagged commit."
              exit 1
            fi

            # A published release is immutable, so its assets cannot be
            # rewritten. The check above already proves that this release was
            # built from this commit, so there is nothing here to refresh,
            # only something to confirm. This branch carries a release that
            # is dispatched a second time, which is how a release recovers
            # from a publish that failed, so it has to reach the jobs that
            # publish rather than end here.
            MISSING=$(missing_assets <<< "${VIEW}")
            if [ -n "${MISSING}" ]; then
              echo "::error::Release ${VERSION} exists, but these assets are missing or have not finished uploading:${MISSING}. A published release is immutable, so this run cannot replace them. Release the next patch version rather than repairing this one."
              exit 1
            fi

            echo "::notice::Release ${VERSION} already exists and carries every asset."
            exit 0
          fi

          # A tag with no release behind it. `gh release create` would adopt it,
          # and the API discards `--target` for a tag that already exists, so
          # the release would be tagged at one commit and carry assets, and an
          # attestation, built from another.
          #
          # The same rule as above about an unreadable answer, for the tag.
          TAG_ERROR=$(mktemp)
          # The type as well as the sha. An annotated tag points at a tag
          # object, so its sha is not a commit and an operator would not find
          # it in `git log` while following the advice below.
          if TAGGED=$(gh api "repos/${GH_REPO}/git/ref/tags/${VERSION}" \
            --jq '"\(.object.sha) (\(.object.type))"' 2>"${TAG_ERROR}"); then
            echo "::error::Tag ${VERSION} already exists at ${TAGGED} and carries no release. Delete the tag if nothing ever released from it, otherwise release the next patch version."
            exit 1
          elif ! grep -qiF 'Not Found' "${TAG_ERROR}"; then
            echo "::error::Could not read tag ${VERSION}: $(tr '\n' ' ' < "${TAG_ERROR}")"
            exit 1
          fi

          PRERELEASE_FLAG=""
          if [ "${TYPE}" = "pre-release" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # `--prerelease` on the draft rather than on the publish, so a draft
          # that an operator inspects reads as the thing it was meant to be.
          #
          # `--target`, so the tag records the commit these assets were built
          # from. Without it the tag lands on the tip of the default branch at
          # release time, which is not necessarily the same commit.
          gh release create "${VERSION}" \
            "${ASSETS[@]}" \
            ${PRERELEASE_FLAG} \
            --draft \
            --target "${SHA}" \
            --title "${VERSION}" \
            --notes-file "${CHANGELOG}" \
            --generate-notes

          # Read back rather than trusted. This is the failure the draft exists
          # to absorb: nothing is published yet, so the version is not spent.
          # The read is captured apart from the check, so that a failure to
          # read carries the same advice as a draft that came back short,
          # rather than ending the job on the raw error of `gh`.
          if ! DRAFT=$(gh release view "${VERSION}" --json isDraft,assets); then
            echo "::error::The draft of ${VERSION} was created, but it could not be read back. Nothing is published, so the version is not spent. Delete the draft with \`gh release delete ${VERSION}\` and dispatch again."
            exit 1
          fi

          # `gh release view` resolves a tag name to a published release ahead
          # of a draft, so this asks what came back rather than assuming it is
          # the draft written a moment ago. A release published into the window
          # between the guard above and this read would otherwise have its
          # assets checked in place of the draft, and would pass.
          if [ "$(jq -r '.isDraft' <<< "${DRAFT}")" != true ]; then
            echo "::error::${VERSION} was drafted by this run, but reading it back returned a release that is already published. This run has published nothing. Work out where that release came from before releasing again."
            exit 1
          fi

          MISSING=$(missing_assets <<< "${DRAFT}")
          if [ -n "${MISSING}" ]; then
            echo "::error::The draft of ${VERSION} is missing these assets:${MISSING}. Nothing is published, so delete the draft with \`gh release delete ${VERSION}\` and dispatch again."
            exit 1
          fi

  publish-marketplace:
    runs-on: ubuntu-latest

    needs: [package, release-github]

    permissions: {}

    env:
      VERSION: ${{ needs.package.outputs.version }}

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle

      - name: Publish to Visual Studio Marketplace
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          TYPE: ${{ github.event.inputs.type }}
        shell: bash
        run: |
          # An empty version would ask the registry about the extension rather
          # than about a release of it, and the answer would read as "already
          # published" below.
          if [ -z "${VERSION}" ]; then
            echo "::error::The package job reported no version."
            exit 1
          fi

          # This job has no checkout and no `node_modules`, so `npx` downloads
          # the package, which is what `--yes` is for. Naming it in full keeps
          # the deprecated `vsce` package of the same name out of the call. The
          # major version tracks the `@vscode/vsce` devDependency, so this job
          # and the job that packaged the file run the same major. Move both
          # together.
          #
          # The lookup retries, as the Open VSX check does, so a busy or a
          # restarting registry does not end a release that had nothing wrong
          # with it. A failure that outlasts the attempts ends the step.
          for attempt in 1 2 3; do
            if SHOWN=$(npx --yes @vscode/vsce@3 show mcanouil.quarto-wizard --json); then
              break
            fi
            if [ "${attempt}" = 3 ]; then
              echo "::error::vsce show failed three times. The Marketplace could not be read."
              exit 1
            fi
            sleep $((attempt * 5))
          done

          # Only two answers are understood, and anything else ends the step.
          # A guard that treats what it cannot read as an absence stops being a
          # guard on the day the output changes shape, and says nothing.
          if [ "${SHOWN}" = "undefined" ]; then
            # `vsce` reports an extension that was never published this way,
            # on standard output and with a zero exit status.
            PUBLISHED=""
          elif jq -e 'type == "object" and (.versions | type == "array")' > /dev/null 2>&1 <<< "${SHOWN}"; then
            PUBLISHED=$(jq -r --arg v "${VERSION}" \
              'first(.versions[] | select(.version == $v) | .version) // ""' <<< "${SHOWN}")
          else
            # The whole answer goes to the log. A workflow command stops at the
            # first newline, so the annotation carries one line of it. The
            # runner reads a workflow command from any line of the log, so the
            # answer of the registry is indented before it is printed.
            echo "vsce show returned:"
            printf '%s\n' "${SHOWN}" | sed 's/^::/  ::/'
            echo "::error::vsce show returned an answer this check cannot read: $(head -c 200 <<< "${SHOWN}" | tr '\n' ' ')"
            exit 1
          fi

          if [ -n "${PUBLISHED}" ]; then
            echo "::notice::mcanouil.quarto-wizard@${VERSION} already on Marketplace, skipping."
            exit 0
          fi

          PRERELEASE_FLAG=""
          if [ "${TYPE}" = "pre-release" ]; then
            PRERELEASE_FLAG="--pre-release"
          fi
          npx --yes @vscode/vsce@3 publish ${PRERELEASE_FLAG} \
            --packagePath "quarto-wizard-${VERSION}.vsix" \
            --pat "${VS_MARKETPLACE_TOKEN}"

  publish-openvsx:
    runs-on: ubuntu-latest

    needs: [package, release-github]

    permissions: {}

    env:
      VERSION: ${{ needs.package.outputs.version }}

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle

      - name: Publish to Open VSX Registry
        env:
          OPEN_VSX_REGISTRY_TOKEN: ${{ secrets.OPEN_VSX_REGISTRY_TOKEN }}
          TYPE: ${{ github.event.inputs.type }}
        shell: bash
        run: |
          # An empty version would ask the registry about the extension rather
          # than about a release of it, and 200 would then read as "already
          # published" below.
          if [ -z "${VERSION}" ]; then
            echo "::error::The package job reported no version."
            exit 1
          fi

          # The step runs under `-e`, so a network failure ends it here. The
          # retries cover a busy or a restarting registry, which would
          # otherwise end a release that had nothing wrong with it. Only a
          # persistent answer reaches the branches below, where anything but
          # the two expected codes is a failure and not an absence.
          STATUS=$(curl -sSL --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' \
            "https://open-vsx.org/api/mcanouil/quarto-wizard/${VERSION}")
          case "${STATUS}" in
            200)
              echo "::notice::mcanouil/quarto-wizard@${VERSION} already on Open VSX, skipping."
              exit 0
              ;;
            404) ;;
            *)
              echo "::error::Open VSX answered ${STATUS} for the version check."
              exit 1
              ;;
          esac

          PRERELEASE_FLAG=""
          if [ "${TYPE}" = "pre-release" ]; then
            PRERELEASE_FLAG="--pre-release"
          fi
          npx --yes ovsx publish ${PRERELEASE_FLAG} \
            "quarto-wizard-${VERSION}.vsix" \
            --pat "${OPEN_VSX_REGISTRY_TOKEN}"

  # The release flips from draft to published here, after both stores have
  # taken the version. Publication is what creates the tag and what makes the
  # release immutable, so it sits after the two steps that are hard to take
  # back. Nothing before this point reserves the version number.
  #
  # Both store jobs read the vsix from the `release-bundle` artifact and not
  # from the GitHub release, so their dependency on `release-github` orders
  # them and carries no data. A draft does not hold either of them up.
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs: [package, release-github, publish-marketplace, publish-openvsx]

    permissions:
      contents: write

    env:
      VERSION: ${{ needs.package.outputs.version }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TYPE: ${{ github.event.inputs.type }}
        shell: bash
        run: |
          set -euo pipefail
          # A release that is already published reaches the store jobs to
          # recover a publish that failed, and there is no draft to flip. The
          # state is read here rather than carried from `release-github` as a
          # job output, because an output would have to gate this job with an
          # `if`, a skipped job would take the deployment down with it, and the
          # deployment would then need a status expression to climb back out.
          #
          # The read is captured apart from the test. A failure inside a test
          # substitution reads as an empty answer, which would take an
          # unreadable release for a published one and skip the publish with a
          # notice, leaving the draft behind and the release never made.
          if ! IS_DRAFT=$(gh release view "${VERSION}" --json isDraft --jq '.isDraft'); then
            echo "::error::Could not read release ${VERSION}, so the draft was not flipped. Both stores already carry this version. Read the state of the release before dispatching again."
            exit 1
          fi
          if [ "${IS_DRAFT}" != true ]; then
            echo "::notice::Release ${VERSION} is already published."
            exit 0
          fi

          # The tag is read here, because publication is what creates it. The
          # guard in `release-github` proves the tag was absent then, and the
          # draft and both store publishes run in between. A tag pushed into
          # that window would be adopted by the publish, which discards the
          # target the draft recorded, and the `concurrency` group covers
          # another run of this workflow and not a tag pushed by hand.
          TAG_ERROR=$(mktemp)
          if gh api "repos/${GH_REPO}/git/ref/tags/${VERSION}" >/dev/null 2>"${TAG_ERROR}"; then
            echo "::error::Tag ${VERSION} appeared while this run was working, so the draft was not published. Both stores already carry this version, and the GitHub release is the only part outstanding. Work out where the tag came from before you touch the draft. A run dispatched again is refused while the tag is there."
            exit 1
          elif ! grep -qiF 'Not Found' "${TAG_ERROR}"; then
            echo "::error::Could not read tag ${VERSION}: $(tr '\n' ' ' < "${TAG_ERROR}")"
            exit 1
          fi

          # `--latest` is named rather than left to the API, which decides it
          # for itself when a draft is published. A pre-release must not become
          # the latest release of this repository, and a release must.
          LATEST=true
          if [ "${TYPE}" = "pre-release" ]; then
            LATEST=false
          fi
          gh release edit "${VERSION}" --draft=false --latest="${LATEST}"

  # The documentation site reads the latest tag, which the publish above has
  # just created. It is also the one step of the release that repeats freely,
  # and `deploy.yml` carries a `workflow_dispatch` for that, so a deployment
  # that fails does not warrant holding the release in a draft.
  deploy:
    needs: publish-release

    permissions:
      contents: read
      pages: write
      id-token: write

    uses: ./.github/workflows/deploy.yml
