name: Build & Test Extension

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
    # No paths filter. The ruleset requires the summary job, and a required
    # check that never starts blocks a pull request for ever. The workflow
    # therefore always runs, and the changes job below decides whether the
    # expensive jobs have anything to do.

concurrency:
  group: ${{ github.workflow }}-${{ github.action }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: read-all

jobs:
  changes:
    if: github.event.pull_request.draft == false
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # No checkout. The file list comes from the API, so this job does not
      # clone the repository at all, where a `git diff` between the base and
      # the head would need the full history.
      - name: List the files the pull request touches
        id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # A manual run has no pull request to compare against, so it builds.
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "code=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # The files endpoint stops at 3000 entries, so a larger pull request
          # gives a short list. Build rather than skip in that case: a wrong
          # skip merges an untested change, a wrong build only costs time.
          total=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files')
          if [[ "${total}" -gt 3000 ]]; then
            echo "${total} changed files exceeds the API limit, so the build runs."
            echo "code=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # A rename carries the old path in previous_filename. Without it, a
          # file renamed out of src/ reports only its new path, and the build
          # would skip although its inputs lost a file.
          changed=$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          echo "Changed files:"
          echo "${changed}"

          # The inputs of the build: the sources, and every file that a step of
          # the build job reads. Fixtures are swept by the Lua job and are
          # edited through pull requests. The vendored schemas under docs/ are
          # not listed: a bot updates those straight on the default branch,
          # where no pull request event fires at all.
          inputs='^(src/|packages/|test-fixtures/.+/_schema\.yml$'
          inputs+='|package\.json$|package-lock\.json$'   # npm ci
          inputs+='|tsconfig\.json$'                      # test-compile
          inputs+='|webpack\.config\.js$'                 # webpack
          inputs+='|eslint\.config\.mjs$'                 # lint
          inputs+='|\.prettierrc\.json$|\.prettierignore$' # format:check
          inputs+='|\.vscode-test\.mjs$'                  # npm test
          inputs+='|\.vscodeignore$'                      # vsce package
          inputs+='|\.github/workflows/build\.yml$)'      # this workflow

          # A here-string and not a pipe. The runner sets pipefail, and grep -q
          # exits at the first match, so a list past the pipe buffer would send
          # SIGPIPE to the writer and the whole condition would read as false.
          if grep -qE "${inputs}" <<< "${changed}"; then
            echo "code=true" >> "${GITHUB_OUTPUT}"
          else
            echo "code=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [25.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # cache: "npm"

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Lint schema package
        id: lint-schema
        shell: bash
        working-directory: packages/schema
        run: npm run lint

      - name: Test schema package
        id: test-schema
        shell: bash
        working-directory: packages/schema
        run: npm test

      - name: Lint snippets package
        id: lint-snippets
        shell: bash
        working-directory: packages/snippets
        run: npm run lint

      - name: Test snippets package
        id: test-snippets
        shell: bash
        working-directory: packages/snippets
        run: npm test

      - name: Lint core package
        id: lint-core
        shell: bash
        working-directory: packages/core
        run: npm run lint

      - name: Test core package
        id: test-core
        shell: bash
        working-directory: packages/core
        run: npm test

      - name: Compile extension
        id: webpack
        shell: bash
        run: npm run webpack

      - name: Run linter
        id: lint
        shell: bash
        run: npm run lint

      - name: Check formatting
        id: format
        shell: bash
        run: npm run format:check

      - name: Compile TypeScript
        id: test-compile
        shell: bash
        run: npm run test-compile

      - name: Run tests (Ubuntu)
        id: test-ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export DISPLAY=':99.0'
          /usr/bin/Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          npm test

      - name: Run tests (Windows/macOS)
        id: test-other
        if: runner.os != 'Linux'
        shell: bash
        run: npm test

      - name: Install Visual Studio Code Extension Manager
        shell: bash
        run: npm install -g @vscode/vsce

      - name: Build extension
        id: build-extension
        shell: bash
        run: vsce package --pre-release --out quarto-wizard.vsix

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: quarto-wizard-${{ github.sha }}-${{ matrix.os }}-${{ matrix.node-version }}
          path: quarto-wizard.vsix
          retention-days: 10

      - name: Generate job result summary
        if: always()
        shell: bash
        run: |
          # Create a summary file for this specific job
          echo "OS: ${{ matrix.os }}" > job-summary.txt
          echo "Node: ${{ matrix.node-version }}" >> job-summary.txt

          # Determine test step outcome based on OS
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            test_outcome="${{ steps.test-ubuntu.outcome }}"
          else
            test_outcome="${{ steps.test-other.outcome }}"
          fi

          # Use steps context to determine overall job status
          if [[ "${{ steps.lint-schema.outcome }}" == "failure" || "${{ steps.test-schema.outcome }}" == "failure" || "${{ steps.lint-snippets.outcome }}" == "failure" || "${{ steps.test-snippets.outcome }}" == "failure" || "${{ steps.lint-core.outcome }}" == "failure" || "${{ steps.test-core.outcome }}" == "failure" || "${{ steps.webpack.outcome }}" == "failure" || "${{ steps.lint.outcome }}" == "failure" || "${{ steps.format.outcome }}" == "failure" || "${{ steps.test-compile.outcome }}" == "failure" || "$test_outcome" == "failure" || "${{ steps.build-extension.outcome }}" == "failure" ]]; then
            echo "Status: failure" >> job-summary.txt
          elif [[ "${{ steps.lint-schema.outcome }}" == "cancelled" || "${{ steps.test-schema.outcome }}" == "cancelled" || "${{ steps.lint-snippets.outcome }}" == "cancelled" || "${{ steps.test-snippets.outcome }}" == "cancelled" || "${{ steps.lint-core.outcome }}" == "cancelled" || "${{ steps.test-core.outcome }}" == "cancelled" || "${{ steps.webpack.outcome }}" == "cancelled" || "${{ steps.lint.outcome }}" == "cancelled" || "${{ steps.format.outcome }}" == "cancelled" || "${{ steps.test-compile.outcome }}" == "cancelled" || "$test_outcome" == "cancelled" || "${{ steps.build-extension.outcome }}" == "cancelled" ]]; then
            echo "Status: cancelled" >> job-summary.txt
          else
            echo "Status: success" >> job-summary.txt
          fi
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> job-summary.txt

      - name: Upload job summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: job-summary-${{ matrix.os }}-${{ matrix.node-version }}
          path: job-summary.txt
          retention-days: 1

  lua:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Lua reference validator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release

      - name: Test Lua reference validator
        id: test-lua
        shell: bash
        working-directory: packages/schema
        run: npm run test:lua

      - name: Generate job result summary
        if: always()
        shell: bash
        run: |
          {
            echo "OS: ubuntu-latest (Lua)"
            echo "Node: n/a"
            echo "Status: ${{ steps.test-lua.outcome }}"
            echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          } > job-summary.txt

      - name: Upload job summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: job-summary-lua
          path: job-summary.txt
          retention-days: 1

  summary:
    if: always() && github.event.pull_request.draft == false
    needs:
      - changes
      - build
      - lua
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Download all job summaries
        # The summary now runs even when a needed job fails, so there may be no
        # artifact at all. The consolidated summary below falls back to the job
        # results in that case, which it cannot do if this step fails first.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: job-summary-*
          path: job-summaries

      - name: Generate consolidated summary
        shell: bash
        run: |
          # `download-artifact` creates no directory when it matches nothing,
          # and this step runs under `-e -o pipefail`, so a `find` over a
          # missing directory ends the step before it prints anything. A
          # pull request that changes no build input uploads no artifact,
          # which is the case this job exists to report on.
          mkdir -p job-summaries

          echo "# 🚀 Quarto Wizard Build & Test Results" >> ${GITHUB_STEP_SUMMARY}
          echo "" >> ${GITHUB_STEP_SUMMARY}

          # Add Pull Request link if triggered by PR event
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "**🔗 Pull Request**: [#${{ github.event.number }}](${{ github.event.pull_request.html_url }}) - ${{ github.event.pull_request.title }}" >> ${GITHUB_STEP_SUMMARY}
            echo "" >> ${GITHUB_STEP_SUMMARY}
          fi

          echo "## 📊 Build Matrix Results" >> ${GITHUB_STEP_SUMMARY}
          echo "" >> ${GITHUB_STEP_SUMMARY}

          # Create table header
          echo "| Operating System | Node.js Version | Status | Timestamp |" >> ${GITHUB_STEP_SUMMARY}
          echo "|------------------|-----------------|--------|-----------|" >> ${GITHUB_STEP_SUMMARY}

          lua_summary="job-summaries/job-summary-lua/job-summary.txt"

          # The table reports the cells that uploaded a summary. A cell killed by
          # its timeout never reaches its upload step, so the table can be short.
          # The verdict below therefore comes from the job results, not from here.
          find job-summaries -type f -name "job-summary.txt" 2>/dev/null | while read summary_file; do
            os=$(grep "OS:" "${summary_file}" | cut -d' ' -f2- || echo "Unknown")
            node=$(grep "Node:" "${summary_file}" | cut -d' ' -f2- || echo "Unknown")
            status=$(grep "Status:" "${summary_file}" | cut -d' ' -f2- || echo "unknown")
            timestamp=$(grep "Timestamp:" "${summary_file}" | cut -d' ' -f2- || echo "Unknown")
            case "${status}" in
              "success") status_emoji="✅" ;;
              "failure") status_emoji="❌" ;;
              "cancelled") status_emoji="🟡" ;;
              *) status_emoji="⚠️" ;;
            esac
            echo "| ${os} | ${node} | ${status_emoji} ${status} | ${timestamp} |" >> ${GITHUB_STEP_SUMMARY}
          done

          if [[ ! -f "${lua_summary}" ]]; then
            echo "| Lua reference validator | n/a | ⚠️ ${{ needs.lua.result }} (no summary uploaded) | $(date -u +"%Y-%m-%d %H:%M:%S UTC") |" >> "${GITHUB_STEP_SUMMARY}"
          fi

          echo "" >> ${GITHUB_STEP_SUMMARY}
          echo "## 📈 Summary Statistics" >> ${GITHUB_STEP_SUMMARY}
          echo "" >> ${GITHUB_STEP_SUMMARY}

          # The table loop runs in a subshell, so its counters are lost. Recount
          # the reported cells here. These describe the table, not the verdict.
          reported_cells=$(find job-summaries -type f -name "job-summary.txt" 2>/dev/null | wc -l)
          successful_cells=$(find job-summaries -type f -name "job-summary.txt" -exec grep -l "Status: success" {} \; 2>/dev/null | wc -l)

          echo "- **Reported Cells**: ${reported_cells// /}" >> ${GITHUB_STEP_SUMMARY}
          echo "- **Successful**: ${successful_cells// /} ✅" >> ${GITHUB_STEP_SUMMARY}
          echo "- **Build Matrix**: ${{ needs.build.result }}" >> ${GITHUB_STEP_SUMMARY}
          echo "- **Lua reference validator**: ${{ needs.lua.result }}" >> ${GITHUB_STEP_SUMMARY}
          echo "" >> ${GITHUB_STEP_SUMMARY}

          # The verdict comes from the job results, which are reported whatever
          # a job managed to upload. A matrix cell killed by its timeout leaves
          # no summary file, so counting files would call that run a success.
          # A skipped job is not a failure: this job is the required check, so
          # a pull request that changes no build input has nothing to run and
          # must still report a verdict.
          failed_names=""
          for job in "changes:${{ needs.changes.result }}" "build:${{ needs.build.result }}" "lua:${{ needs.lua.result }}"; do
            case "${job#*:}" in
              "success" | "skipped") ;;
              *) failed_names="${failed_names} ${job}" ;;
            esac
          done

          if [[ -z "${failed_names}" ]]; then
            echo "## 🎉 Overall Result: SUCCESS" >> ${GITHUB_STEP_SUMMARY}
            if [[ "${{ needs.changes.outputs.code }}" == "true" ]]; then
              echo "Every job completed successfully." >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "This pull request changes no build input, so the build matrix and the Lua job did not run." >> "${GITHUB_STEP_SUMMARY}"
            fi
          else
            echo "## ⚠️ Overall Result: FAILURE" >> ${GITHUB_STEP_SUMMARY}
            echo "Not successful:${failed_names}. Check the individual job logs for details." >> ${GITHUB_STEP_SUMMARY}
          fi

          # The job runs on every outcome, so it has to carry the verdict it
          # prints. Without this it reports success while the table says failure.
          if [[ -n "${failed_names}" ]]; then
            exit 1
          fi
