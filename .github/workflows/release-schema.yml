name: Release Extension Schema

concurrency:
  group: release-schema
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'Version ("MAJOR.MINOR.PATCH")'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      # Ahead of the checkout, because it reads the ref of the dispatch and
      # nothing of the tree.
      #
      # `workflow_dispatch` lets an operator pick any ref. A tag and its
      # attestation built from a branch other than `main` cannot be told
      # apart from one built from `main` by anyone who later fetches it, so
      # the dispatch is refused here rather than left for a reader to notice.
      - name: Check the release runs from main
        shell: bash
        run: |
          set -euo pipefail
          # The full ref, and not the short name. A tag named `main` gives the
          # same short name as the branch, and anyone who can push a tag can
          # make one, without touching the protection on the branch.
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::The release runs from the main branch only. It was dispatched from ${GITHUB_REF}."
            exit 1
          fi

      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      # The commit of the dispatch, and not the tip of the branch it names, so
      # that a commit landing between the dispatch and this step cannot be
      # released. The bump below commits on it, and the commit that reaches
      # `main` is the one that `--target` names later, so the tag, the assets
      # and the attestation all agree.
      #
      # The checkout keeps the token, so the push below runs as the app, which
      # the ruleset exempts. That is what lets the bump reach `main` with no
      # pull request.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}

      # The version is an input and the module is stamped from it, so the two
      # can no longer disagree. The stamped version is read all the same, to
      # tell a bump from a dispatch of a version that is already stamped.
      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${INPUT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version input must be MAJOR.MINOR.PATCH. Read: ${INPUT_VERSION}"
            exit 1
          fi

          # The first match only, because `readModuleVersion` in the test
          # helper reads the first match too. A second `@version` line, in the
          # LuaDoc of an inner function for example, would otherwise pass the
          # test while this step read the wrong line.
          STAMPED=$(sed -n 's/^---[[:space:]]*@version[[:space:]]\{1,\}\([0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}\)[[:space:]]*$/\1/p' \
            packages/schema/src/validation/schema.lua | head -n 1)
          if [ -z "${STAMPED}" ]; then
            echo "::error file=packages/schema/src/validation/schema.lua,line=6::No @version tag found."
            exit 1
          fi

          # Equal is how a dispatch recovers a run that pushed the bump and
          # then died before the release was published. The stamp, the built
          # copies and the heading are already on `main`, and the section that
          # carries the notes is no longer named `Unreleased`, so such a run
          # must release the commit it finds rather than write anything.
          if [ "${INPUT_VERSION}" = "${STAMPED}" ]; then
            BUMP=false
            echo "::notice::Version ${INPUT_VERSION} is already stamped, so this run releases the current commit and writes nothing."
          elif [ "$(printf '%s\n%s\n' "${STAMPED}" "${INPUT_VERSION}" | sort -V | head -n 1)" = "${INPUT_VERSION}" ]; then
            echo "::error::The version input ${INPUT_VERSION} is lower than the stamped version ${STAMPED}."
            exit 1
          else
            BUMP=true
            echo "::notice file=packages/schema/src/validation/schema.lua,line=6::Bumping the extension schema from ${STAMPED} to ${INPUT_VERSION}."
          fi

          {
            echo "bump=${BUMP}"
            echo "version=${INPUT_VERSION}"
            # The tag is named once, here, so that the steps below cannot
            # spell it differently from one another.
            echo "tag=schema-v${INPUT_VERSION}"
          } >> "${GITHUB_OUTPUT}"

      # Ahead of the attestation, because an attestation is a write to a public
      # append-only log, and a run that fails after it leaves a signed record
      # of artefacts that no release carries and that nobody can withdraw.
      #
      # Ahead of the setup and the suites too, because this guard needs only
      # the tree and `gh`. A dispatch at a version that is already released is
      # an ordinary operator slip, and refusing it here costs seconds rather
      # than a Quarto download, an `npm ci` and two suites.
      - name: Check the release and its tag are absent
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET_NAMES=(schema.lua extension-schema.json extension-schema-v2.json)

          # One call, which both reports whether the release is there and
          # lists what it carries. It reads the state of each asset and not
          # the name alone, because an upload that died part way leaves the
          # name on the release with a state that is not `uploaded`, and that
          # is the very failure this guard exists to catch.
          #
          # `release not found` is the one failure that means the release is
          # absent. Every other failure is a failure to read, and a guard that
          # takes what it cannot read as an absence stops being a guard. This
          # one would create a release that is already there.
          VIEW_ERROR=$(mktemp)
          if VIEW=$(gh release view "${TAG}" --json isDraft,assets 2>"${VIEW_ERROR}"); then
            FOUND=true
          elif grep -qiF 'release not found' "${VIEW_ERROR}"; then
            FOUND=false
          else
            echo "::error::Could not read release ${TAG}: $(tr '\n' ' ' < "${VIEW_ERROR}")"
            exit 1
          fi

          if [ "${FOUND}" = true ]; then
            # A draft is the one shape that can be cleared. It holds no tag
            # yet and it is not immutable, so an earlier run that failed
            # between the draft and the publish leaves something the operator
            # can delete and dispatch again at the same version.
            if [ "$(jq -r '.isDraft' <<< "${VIEW}")" = true ]; then
              echo "::error::A draft release ${TAG} is left from an earlier run. Delete it with \`gh release delete ${TAG}\`, then dispatch again."
              exit 1
            fi

            # This repository publishes immutable releases. A published one
            # cannot take an asset, lose one, or give its tag back: the tag
            # name stays reserved even after the release and the tag are
            # deleted, so this version can never be published again. The only
            # way on is the next version, whether or not the assets are all
            # there.
            PRESENT=$(jq -r '.assets[] | select(.state == "uploaded") | .name' <<< "${VIEW}")
            MISSING=""
            for name in "${ASSET_NAMES[@]}"; do
              grep -qxF "${name}" <<< "${PRESENT}" || MISSING="${MISSING} ${name}"
            done

            if [ -z "${MISSING}" ]; then
              echo "::error::Release ${TAG} is already published and carries every asset. Dispatch again at the next version."
              exit 1
            fi

            echo "::error::Release ${TAG} is published but these assets are missing:${MISSING}. An immutable release cannot be repaired and its tag name cannot be reused, so ${VERSION} is spent. Dispatch again at the next version."
            exit 1
          fi

          # A tag with no release behind it. `gh release create` would adopt it
          # and the API discards `--target` for a tag that already exists, so
          # the release would be tagged at one commit and carry assets, and an
          # attestation, built from another.
          #
          # The same rule as above about an unreadable answer, for the tag.
          TAG_ERROR=$(mktemp)
          # The type as well as the sha. An annotated tag points at a tag
          # object, so its sha is not a commit and an operator would not find
          # it in `git log` while following the advice below.
          if TAGGED=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" \
            --jq '"\(.object.sha) (\(.object.type))"' 2>"${TAG_ERROR}"); then
            echo "::error::Tag ${TAG} already exists at ${TAGGED} and carries no release. Delete the tag if nothing ever released from it, otherwise dispatch again at the next version."
            exit 1
          elif ! grep -qiF 'Not Found' "${TAG_ERROR}"; then
            echo "::error::Could not read tag ${TAG}: $(tr '\n' ' ' < "${TAG_ERROR}")"
            exit 1
          fi

      # Alongside the guard above, and ahead of the setup, because it reads one
      # small file and needs no toolchain. A dispatch with nothing to release
      # is an ordinary operator slip, and refusing it here costs seconds
      # rather than a Quarto download, an `npm ci` and two suites.
      - name: Check the Unreleased section carries entries
        if: ${{ steps.version.outputs.bump == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! MESSAGE=$(packages/schema/scripts/changelog-section.sh packages/schema/CHANGELOG.md Unreleased 2>&1 >/dev/null); then
            echo "::error file=packages/schema/CHANGELOG.md::${MESSAGE}"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release

      - name: Install dependencies
        shell: bash
        run: npm ci

      # The stamp is written before the suites and pushed after them. A change
      # to `schema.lua` is a change to a source file, so it cannot take the
      # trade that the bump job of `release.yml` records, where a mechanical
      # commit reaches `main` without being built. The major of the stamped
      # version must equal the major of the meta-schema, and the test that
      # holds it is in the package suite below.
      #
      # `build:schema` runs here rather than in a step of its own, so the copy
      # the documentation site serves lands in the same commit as the stamp
      # and the two cannot disagree.
      - name: Stamp the version and build the served copies
        if: ${{ steps.version.outputs.bump == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          packages/schema/scripts/stamp-version.sh "${VERSION}"
          npm run build:schema

      # The gates. The package suite holds the keyword parity test, the
      # published copies test, and the test that the stamped version and the
      # meta-schema agree on their major. The Lua suite holds the validator
      # tests and the conformance sweep over every schema this repository
      # carries. Both run on the stamped tree, and before anything is pushed
      # or published.
      - name: Test schema package
        shell: bash
        working-directory: packages/schema
        run: npm test

      - name: Test Lua reference validator
        shell: bash
        working-directory: packages/schema
        run: npm run test:lua

      - name: Stage the release assets
        env:
          ASSETS: ${{ runner.temp }}/assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${ASSETS}"
          cp packages/schema/src/validation/schema.lua "${ASSETS}/schema.lua"
          cp packages/schema/src/validation/extension-schema.json "${ASSETS}/extension-schema.json"
          cp packages/schema/src/validation/extension-schema-v2.json "${ASSETS}/extension-schema-v2.json"

      # Ahead of the push, so that the last thing the job can refuse is
      # refused while everything is still on the runner. It reads the section
      # the stamp renamed, and refuses one that carries no entry, which a test
      # on the size of the file cannot do: the single blank line between two
      # headings is one byte.
      - name: Read the release notes
        env:
          NOTES: ${{ runner.temp }}/notes.md
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! MESSAGE=$(packages/schema/scripts/changelog-section.sh packages/schema/CHANGELOG.md "${VERSION}" 2>&1 >"${NOTES}"); then
            echo "::error file=packages/schema/CHANGELOG.md::${MESSAGE}"
            exit 1
          fi

      - name: Push the bump to main
        id: push
        if: ${{ steps.version.outputs.bump == 'true' }}
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # The identity of the app, which is what the ruleset exempts. It is
          # set on the commit rather than in the configuration of the runner,
          # because this job makes one commit and no other.
          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git add packages/schema/CHANGELOG.md packages/schema/src/validation/schema.lua docs/assets/schema
          git \
            -c "user.name=${APP_SLUG}[bot]" \
            -c "user.email=${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com" \
            commit -m "ci: bump the extension schema to ${VERSION} :rocket:"

          # A plain push, so it is a fast-forward. If `main` moved since the
          # dispatch, git refuses it and says so, and nothing is released.
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      # Drafted first, and published only once every asset is there, because
      # publication is the point of no return described at the guard above. A
      # draft carries no tag and is not immutable, so a run that dies before
      # the publish costs nothing but a draft to delete. This is the order
      # GitHub documents, for the same reason.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ASSETS: ${{ runner.temp }}/assets
          NOTES: ${{ runner.temp }}/notes.md
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          # The commit the bump pushed, or the commit the dispatch resolved
          # when the version was already stamped. Either way the assets were
          # built from it.
          RELEASE_SHA: ${{ steps.push.outputs.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            "${ASSETS}/schema.lua#Quarto extension schema validator (lua)" \
            "${ASSETS}/extension-schema.json#Quarto extension meta-schema v1 (json)" \
            "${ASSETS}/extension-schema-v2.json#Quarto extension meta-schema v2 (json)" \
            --draft \
            --target "${RELEASE_SHA}" \
            --title "Extension schema ${VERSION}" \
            --notes-file "${NOTES}"

      - name: Check the draft carries every asset
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET_NAMES=(schema.lua extension-schema.json extension-schema-v2.json)

          # The state of each asset and not the name alone, for the reason
          # given at the guard above.
          PRESENT=$(gh release view "${TAG}" --json assets \
            --jq '.assets[] | select(.state == "uploaded") | .name')
          MISSING=""
          for name in "${ASSET_NAMES[@]}"; do
            grep -qxF "${name}" <<< "${PRESENT}" || MISSING="${MISSING} ${name}"
          done
          if [ -n "${MISSING}" ]; then
            echo "::error::The draft of ${TAG} is missing these assets:${MISSING}. Nothing is published, so delete the draft with \`gh release delete ${TAG}\` and dispatch again."
            exit 1
          fi

      # After the draft is known to be complete, and before it is published.
      # An attestation is a write to a public append-only log that nobody can
      # withdraw, so it must not name artefacts that end up in a draft which
      # is deleted rather than published.
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/assets/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # The tag is read again, here, because publication is what creates
          # it. The guard near the start of the job proves the tag was absent
          # then, and the suites, the staging and the draft all run in
          # between. A tag pushed into that window would be adopted by the
          # publish, which discards the target the draft recorded, and the
          # `concurrency` group covers another run of this workflow and not a
          # tag pushed by hand.
          TAG_ERROR=$(mktemp)
          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>"${TAG_ERROR}"; then
            echo "::error::Tag ${TAG} appeared while this run was working. Nothing is published, so delete the draft with \`gh release delete ${TAG}\` and work out where the tag came from before releasing again."
            exit 1
          elif ! grep -qiF 'Not Found' "${TAG_ERROR}"; then
            echo "::error::Could not read tag ${TAG}: $(tr '\n' ' ' < "${TAG_ERROR}")"
            exit 1
          fi

          # `--latest=false`, so that the extension release stays the latest
          # release of this repository. Tools that ask an origin for its newest
          # release mean the extension, and a schema release must not answer
          # that question.
          gh release edit "${TAG}" --draft=false --latest=false
