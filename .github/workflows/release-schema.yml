name: Release Extension Schema

concurrency:
  group: release-schema
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      # The commit of the dispatch, and not the tip of the branch it names, so
      # that a commit landing between the dispatch and this step cannot be
      # released. It is also the commit that `--target` names later, so the
      # tag, the assets and the attestation all agree.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # `workflow_dispatch` lets an operator pick any ref. A tag and its
      # attestation built from a branch other than `main` cannot be told
      # apart from one built from `main` by anyone who later fetches it, so
      # the dispatch is refused here rather than left for a reader to notice.
      - name: Check the release runs from main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::The release runs from main only. It was dispatched from ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Set up Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release

      - name: Install dependencies
        shell: bash
        run: npm ci

      # The gates. The package suite holds the keyword parity test, the
      # published copies test, and the test that the stamped version and the
      # meta-schema agree on their major. The Lua suite holds the validator
      # tests and the conformance sweep over every schema this repository
      # carries. Both run before anything is written.
      - name: Test schema package
        shell: bash
        working-directory: packages/schema
        run: npm test

      - name: Test Lua reference validator
        shell: bash
        working-directory: packages/schema
        run: npm run test:lua

      # The version is read from the file and not taken as an input, so the
      # tag cannot name a version that the module does not stamp.
      - name: Read the stamped version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # The first match only, because `readModuleVersion` in the test
          # helper reads the first match too. A second `@version` line, in the
          # LuaDoc of an inner function for example, would otherwise pass the
          # test and write two lines into `GITHUB_OUTPUT`, of which the second
          # is not a `key=value` pair.
          VERSION=$(sed -n 's/^---[[:space:]]*@version[[:space:]]\{1,\}\([0-9]\{1,\}\.[0-9]\{1,\}\.[0-9]\{1,\}\)[[:space:]]*$/\1/p' \
            packages/schema/src/validation/schema.lua | head -n 1)
          if [ -z "${VERSION}" ]; then
            echo "::error file=packages/schema/src/validation/schema.lua,line=6::No @version tag found."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "::notice file=packages/schema/src/validation/schema.lua,line=6::Schema version ${VERSION}"

      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      # Ahead of the attestation, because an attestation is a write to a public
      # append-only log, and a run that fails after it leaves a signed record
      # of artefacts that no release carries and that nobody can withdraw.
      - name: Check the release and its tag are absent
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="schema-v${VERSION}"
          ASSET_NAMES=(schema.lua extension-schema.json extension-schema-v2.json)

          # One call, which both reports whether the release is there and
          # lists what it carries. It reads the state of each asset and not
          # the name alone, because an upload that died part way leaves the
          # name on the release with a state that is not `uploaded`, and that
          # is the very failure this guard exists to catch.
          #
          # `release not found` is the one failure that means the release is
          # absent. Every other failure is a failure to read, and a guard that
          # takes what it cannot read as an absence stops being a guard. This
          # one would create a release that is already there.
          VIEW_ERROR=$(mktemp)
          if PRESENT=$(gh release view "${TAG}" --json assets \
            --jq '.assets[] | select(.state == "uploaded") | .name' 2>"${VIEW_ERROR}"); then
            FOUND=true
          elif grep -qiF 'release not found' "${VIEW_ERROR}"; then
            FOUND=false
          else
            echo "::error::Could not read release ${TAG}: $(tr '\n' ' ' < "${VIEW_ERROR}")"
            exit 1
          fi

          # A published release is immutable and its tag names the commit that
          # its assets were built from. Either shape of an existing release
          # stops here: repairing one is not what a second dispatch is for.
          if [ "${FOUND}" = true ]; then
            MISSING=""
            for name in "${ASSET_NAMES[@]}"; do
              grep -qxF "${name}" <<< "${PRESENT}" || MISSING="${MISSING} ${name}"
            done

            if [ -z "${MISSING}" ]; then
              echo "::error::Release ${TAG} already exists and carries every asset. Bump the @version tag in schema.lua and dispatch again."
              exit 1
            fi

            echo "::error::Release ${TAG} exists, but these assets are missing or have not finished uploading:${MISSING}. A published release is immutable, so this run cannot repair it. Delete the release and its tag, or bump the @version tag in schema.lua and release that version instead."
            exit 1
          fi

          # The tag outlives the release, because deleting a release leaves its
          # tag behind. `gh release create` reuses a tag that is already there,
          # and the API discards `--target` for it, so without this check the
          # release would be tagged at one commit and carry assets, and an
          # attestation, built from another.
          if TAGGED=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null); then
            echo "::error::Tag ${TAG} already exists at ${TAGGED}, and carries no release. Delete the tag, or bump the @version tag in schema.lua and release that version instead."
            exit 1
          fi

      - name: Stage the release assets
        env:
          ASSETS: ${{ runner.temp }}/assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${ASSETS}"
          cp packages/schema/src/validation/schema.lua "${ASSETS}/schema.lua"
          cp packages/schema/src/validation/extension-schema.json "${ASSETS}/extension-schema.json"
          cp packages/schema/src/validation/extension-schema-v2.json "${ASSETS}/extension-schema-v2.json"

      - name: Read the release notes
        env:
          NOTES: ${{ runner.temp }}/notes.md
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # The same reader that `release.yml` uses over the root changelog.
          # A `$` anchor inside a group is undefined in POSIX ERE and varies
          # between awk implementations, so the heading is matched with the
          # form this repository already proves.
          awk -v version="^## ${VERSION}.*" '
            $0 ~ version {flag=1; next}
            /^## / && flag {flag=0}
            flag
          ' packages/schema/CHANGELOG.md >"${NOTES}"
          if [ ! -s "${NOTES}" ]; then
            echo "::error file=packages/schema/CHANGELOG.md::No entries under a \"## ${VERSION}\" heading. Rename the Unreleased heading to ${VERSION} before you release."
            exit 1
          fi

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/assets/*

      - name: Create the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ASSETS: ${{ runner.temp }}/assets
          NOTES: ${{ runner.temp }}/notes.md
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="schema-v${VERSION}"

          # `--latest=false`, so that the extension release stays the latest
          # release of this repository. Tools that ask an origin for its newest
          # release mean the extension, and a schema release must not answer
          # that question.
          gh release create "${TAG}" \
            "${ASSETS}/schema.lua#Quarto extension schema validator (lua)" \
            "${ASSETS}/extension-schema.json#Quarto extension meta-schema v1 (json)" \
            "${ASSETS}/extension-schema-v2.json#Quarto extension meta-schema v2 (json)" \
            --latest=false \
            --target "${GITHUB_SHA}" \
            --title "Extension schema ${VERSION}" \
            --notes-file "${NOTES}"
